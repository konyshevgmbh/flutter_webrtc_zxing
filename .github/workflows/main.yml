name: Flutter CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions: read-all

jobs:
  lint:
    name: "Lint Dart Code"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - uses: bluefireteam/melos-action@v3
        with:
          run-bootstrap: true
          enforce-lockfile: true

      - name: Analyze Dart code
        run: melos exec -- dart analyze .

  build-example:
    name: 'Build example (${{ matrix.target }}, ${{ matrix.os }})'
    runs-on: ${{ matrix.os }}-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: android
            os: ubuntu
          - target: ios
            os: macos
          - target: macos
            os: macos
          - target: linux
            os: ubuntu
          - target: windows
            os: windows
          - target: web
            os: ubuntu
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Copy ZXing source files for iOS/macOS
        if: matrix.target == 'ios' || matrix.target == 'macos'
        run: ./scripts/update_ios_macos_src.sh

      - name: Setup Java for Android
        if: matrix.target == 'android'
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: temurin

      - name: Install Linux dependencies
        if: matrix.target == 'linux' && matrix.os == 'ubuntu'
        run: |
          sudo apt update
          sudo apt install -y \
            cmake dbus libblkid-dev libgtk-3-dev liblzma-dev ninja-build \
            pkg-config xvfb network-manager upower

      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - uses: bluefireteam/melos-action@v3
        with:
          run-bootstrap: true
          enforce-lockfile: true

      - name: Build example for ${{ matrix.target }}
        shell: bash
        run: |
          cd example
          case ${{ matrix.target }} in
            ios)     flutter build ios --debug --no-codesign ;;
            macos)   flutter build macos --debug ;;
            android) flutter build appbundle --debug ;;
            linux)   flutter build linux --debug ;;
            windows) flutter build windows --debug ;;
            web)     flutter build web --debug ;;
            *)       echo "Unknown target: ${{ matrix.target }}"; exit 1 ;;
          esac

  test-example:
    name: 'Test example (${{ matrix.target }}, ${{ matrix.os }})'
    runs-on: ${{ matrix.os }}-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: ios
            os: macos
            device: iphone
          - target: macos
            os: macos
            device: macos
          - target: linux
            os: ubuntu
            device: linux
          - target: windows
            os: windows
            device: windows
          - target: web
            os: ubuntu
            device: chrome
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Copy ZXing source files for iOS/macOS
        if: matrix.target == 'ios' || matrix.target == 'macos'
        run: ./scripts/update_ios_macos_src.sh

      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - uses: bluefireteam/melos-action@v3
        with:
          run-bootstrap: true
          enforce-lockfile: true

      - name: Install Linux dependencies
        if: matrix.target == 'linux' && matrix.os == 'ubuntu'
        run: |
          sudo apt update
          sudo apt install -y \
            cmake dbus libblkid-dev libgtk-3-dev liblzma-dev ninja-build \
            pkg-config xvfb network-manager upower

      - name: Start chromedriver for web tests
        if: matrix.target == 'web'
        run: chromedriver --port=4444 &

      - name: Launch iOS Simulator
        if: matrix.target == 'ios'
        run: |
          RUNTIME_ID=$(xcrun simctl list runtimes | grep -o "com.apple.CoreSimulator.SimRuntime.iOS-[0-9-]*" | sort -r | head -n 1)
          echo "Using runtime: $RUNTIME_ID"
          simulator_id=$(xcrun simctl create iphone-zxing \
            com.apple.CoreSimulator.SimDeviceType.iPhone-15 \
            $RUNTIME_ID)
          xcrun simctl boot ${simulator_id}

      - name: Run tests
        shell: bash
        run: |
          cd ./example
          if [ "${{ matrix.target }}" == "linux" ] || [ "${{ matrix.target }}" == "web" ]; then
            xvfb-run flutter test integration_test -d "${{ matrix.device }}"
          else
            flutter test integration_test -d "${{ matrix.device }}"
          fi

  test-example-android:
    name: 'Test example on Android API ${{ matrix.api-level }}'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: 24
            target: default
            arch: x86_64
          - api-level: 34
            target: google_apis
            arch: x86_64
          - api-level: 36
            target: google_apis
            arch: x86_64
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java for Android
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: temurin

      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - uses: bluefireteam/melos-action@v3
        with:
          run-bootstrap: true
          enforce-lockfile: true

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: gradle/actions/setup-gradle@v6

      - name: Setup AVD cache
        uses: actions/cache@v5
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ matrix.api-level }}

      - name: Create and cache AVD snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      - name: Run tests on Android API ${{ matrix.api-level }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            flutter devices
            cd ./example && flutter test integration_test
