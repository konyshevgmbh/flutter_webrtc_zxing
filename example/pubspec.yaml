name: flutter_webrtc_zxing_example
description: Demonstrates how to use the flutter_webrtc_zxing plugin.
version: 0.0.1
publish_to: "none" # Remove this line if you wish to publish to pub.dev

environment:
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_webrtc_zxing:
    path: ../

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.0

flutter_launcher_icons:
  android: ic_launcher
  ios: true
  image_path: icon.png
  remove_alpha_ios: true
  web:
    generate: true
    image_path: icon.png
    background_color: "#1a6cf5"
    theme_color: "#1a6cf5"
  windows:
    generate: true
    image_path: icon.png
    icon_size: 48
  macos:
    generate: true
    image_path: icon.png

flutter:
  uses-material-design: true
